spring.application.name=payment-service

# ---------- MySQL ----------
# Deliberately its own database, separate from pgms_db (the main backend's database).
# This is "database per service": the payment ledger belongs to this service alone, and
# nothing outside this codebase is allowed to read or write payment_service_db directly -
# not even the main backend. Everything crosses the boundary over the HTTP API below.
spring.datasource.url=jdbc:mysql://localhost:3306/payment_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Different port from the main backend (8080) so both can run side by side on one machine.
server.port=8081

# ---------- Razorpay ----------
# Get these from https://dashboard.razorpay.com/app/keys
# Only this service holds these secrets now - the main backend no longer has them at all.
razorpay.key-id=rzp_test_REPLACE_ME
razorpay.key-secret=REPLACE_ME
razorpay.webhook-secret=REPLACE_ME

# ---------- Internal service-to-service auth ----------
# Every request must carry this exact value in an X-Internal-Token header, except the
# public Razorpay webhook and the health check. This is NOT a replacement for the main
# backend's JWT user-auth - it's a separate, simpler check that answers a different
# question ("is this call coming from our own backend?") rather than "which human is this?".
# Must match payment.service.internal-token in backend/src/main/resources/application.properties.
internal.api.token=CHANGE_ME_SHARED_SECRET_WITH_BACKEND
