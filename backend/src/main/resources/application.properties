spring.application.name=pg-management-system

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/pgms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# ---------- JWT ----------
# Change this secret before deploying to production. Must be a long random string.
jwt.secret=REPLACE_THIS_WITH_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_256_BITS
jwt.expiration-ms=86400000

# ---------- Payment microservice ----------
# The backend no longer talks to Razorpay directly - that, and the payment ledger, now live
# in the standalone payment-service (../payment-service), reached only over this internal
# link. internal-token must match payment-service's internal.api.token exactly.
payment.service.base-url=http://localhost:8081
payment.service.internal-token=CHANGE_ME_SHARED_SECRET_WITH_BACKEND

# ---------- File upload (govt ID docs, property images) ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
